version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Strict-Transport-Security'
              value: 'max-age=31536000; includeSubDomains'
            - key: 'X-Content-Type-Options'
              value: 'nosniff'
            - key: 'X-Frame-Options'
              value: 'DENY'
            - key: 'Referrer-Policy'
              value: 'strict-origin-when-cross-origin'
        # Cache static assets aggressively
        - pattern: '/assets/**'
          headers:
            - key: 'Cache-Control'
              value: 'public, max-age=31536000, immutable'
        # Never cache the HTML entry point (SPA routing)
        - pattern: '/index.html'
          headers:
            - key: 'Cache-Control'
              value: 'no-cache, no-store, must-revalidate'
